<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ScamShield | Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">🛡️</div>
        <h1>ScamShield</h1>
        <p class="auth-subtitle">Sign in to scan job offers for scam signals</p>

        <div id="errorMsg" class="error-msg hidden"></div>

        <form id="loginForm">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="primary-btn">Sign In</button>
        </form>

        <p class="auth-footer">Don't have an account? <a href="register.html">Register</a></p>
    </div>
</div>

<script src="auth.js"></script>
</body>
</html>
