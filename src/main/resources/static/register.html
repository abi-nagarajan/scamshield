<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ScamShield | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">🛡️</div>
        <h1>Create Account</h1>
        <p class="auth-subtitle">Join ScamShield to start scanning job offers</p>

        <div id="errorMsg" class="error-msg hidden"></div>
        <div id="successMsg" class="success-msg hidden"></div>

        <form id="registerForm">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password" required minlength="6">
            </div>
            <button type="submit" class="primary-btn">Create Account</button>
        </form>

        <p class="auth-footer">Already have an account? <a href="login.html">Sign In</a></p>
    </div>
</div>

<script src="auth.js"></script>
</body>
</html>
